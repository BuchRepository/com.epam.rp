name: CI - .NET Tests with Selenium Grid

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore com.epam.rp.sln
      - run: dotnet build com.epam.rp.sln --configuration Release --no-restore
      - run: dotnet test com.epam.rp.api/com.epam.rp.api.csproj --configuration Release

  ui-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chrome, firefox]
    services:
      selenium-hub:
        image: selenium/hub:4.23.0
        ports: [4444:4444]
      chrome-node:
        image: selenium/node-chrome:4.23.0
        env:
          SE_EVENT_BUS_HOST: selenium-hub
          SE_EVENT_BUS_PUBLISH_PORT: 4442
          SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
      firefox-node:
        image: selenium/node-firefox:4.23.0
        env:
          SE_EVENT_BUS_HOST: selenium-hub
          SE_EVENT_BUS_PUBLISH_PORT: 4442
          SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
    env:
      SELENIUM_GRID_URL: http://selenium-hub:4444/wd/hub
      RUN_REMOTE: "true"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore com.epam.rp.sln

      - name: Build solution
        run: dotnet build com.epam.rp.sln --configuration Release --no-restore

      - name: Create appsettings.json from secrets
        run: |
          mkdir -p com.epam.rp.api/bin/Release/net8.0/
          mkdir -p com.epam.rp.ui/bin/Release/net8.0/

          cat > com.epam.rp.ui/bin/Release/net8.0/appsettings.json <<EOL
          {
            "LOGIN": "${{ secrets.TEST_LOGIN }}",
            "PASSWORD": "${{ secrets.TEST_PASSWORD }}",
            "API_TOKEN": "${{ secrets.API_TOKEN }}",
            "Serilog": {
              "Using": ["Serilog.Sinks.Console", "Serilog.Sinks.File"],
              "MinimumLevel": {
                "Default": "Information",
                "Override": {
                  "Microsoft": "Warning",
                  "System": "Warning"
                }
              },
              "WriteTo": [
                {"Name": "Console"},
                {"Name": "File", "Args": {"path": "${{ github.workspace }}/logs/logfile.log",    "restrictedToMinimumLevel": "Information"}}
              ]
            }
          }
          EOL

          cp com.epam.rp.ui/bin/Release/net8.0/appsettings.json com.epam.rp.api/bin/Release/net8.0/appsettings.json

      - name: Wait for Selenium Grid to be ready
        run: |
          echo "Waiting for Selenium Grid to start..."
          for i in {1..60}; do
            if curl -s http://localhost:4444/status | grep -q '"ready":true'; then
              echo "Selenium Grid is ready!"
              break
            fi
            echo "Waiting ($i/60)..."
            sleep 2
          done

      - name: Run UI tests in ${{ matrix.browser }}
        run: dotnet test com.epam.rp.sln \
            --configuration Release \
            --logger "console;verbosity=detailed" \
            --logger "trx;LogFileName=test-results-${{ matrix.browser }}.trx" \
            -- TestRunParameters.Parameter(name=\"browser\",value=\"${{ matrix.browser }}\")
        continue-on-error: true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.browser }}
          path: ./com.epam.rp.ui/bin/Release/net8.0/screenshots/*.png
          if-no-files-found: ignore

      - name: List files in Release folder
        run: ls -lah ./com.epam.rp.api/bin/Release/net8.0/ || true && ls -lah ./com.epam.rp.ui/bin/Release/net8.0/ || true

      - name: Upload UI Report
        uses: actions/upload-artifact@v4
        with:
          name: ui-report
          path: ./com.epam.rp.ui/bin/Release/net8.0/index.html

      - name: Upload API Report
        uses: actions/upload-artifact@v4
        with:
          name: api-report
          path: ./com.epam.rp.api/bin/Release/net8.0/index.html
