name: .NET Tests in Chrome Container

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: selenium/standalone-chrome:114.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # 1. Setup .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x

      # 2. Restore NuGet packages
      - name: Restore NuGet packages
        run: dotnet restore ./ReportPortal/ReportPortal.csproj

      # 3. Build solution
      - name: Build solution
        working-directory: ./ReportPortal
        run: dotnet build ReportPortal.csproj --no-restore --configuration Release

      # 4. Create appsettings.json with secrets
      - name: Create appsettings.json
        working-directory: ./ReportPortal
        run: |
          echo "{
            \"LOGIN\": \"${{ secrets.TEST_LOGIN }}\",
            \"PASSWORD\": \"${{ secrets.TEST_PASSWORD }}\"
          }" > appsettings.json

      # 5. Run NUnit tests
      - name: Run tests
        working-directory: ./ReportPortal
        run: dotnet test ReportPortal.csproj --no-build --configuration Release --logger "trx;LogFileName=test_results.trx"
