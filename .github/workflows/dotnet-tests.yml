name: Run Selenium Tests

on:
  push:
    branches:
      - main       # Trigger workflow on push to the main branch
  pull_request:   # Trigger workflow on any pull request

jobs:
  build-and-test:
    runs-on: ubuntu-latest   # Use the latest Ubuntu runner

    steps:
      # 1. Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Setup .NET SDK
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x   # Use .NET 8 SDK

      # 3. Install Google Chrome
      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get install -f -y

      # 4. Install ChromeDriver (compatible with installed Chrome)
      - name: Install ChromeDriver
        run: |
          CHROME_VERSION=$(google-chrome --version | awk '{print $3}')
          echo "Detected Chrome version: $CHROME_VERSION"
          CHROMEDRIVER_VERSION=$(curl -sS https://chromedriver.storage.googleapis.com/LATEST_RELEASE_$CHROME_VERSION)
          wget -q https://chromedriver.storage.googleapis.com/$CHROMEDRIVER_VERSION/chromedriver_linux64.zip
          unzip chromedriver_linux64.zip
          sudo mv chromedriver /usr/local/bin/

      # 5. Restore NuGet packages
      - name: Restore NuGet packages
        run: dotnet restore ./ReportPortal/ReportPortal.csproj

      # 6. Build the solution
      - name: Build solution
        working-directory: ./ReportPortal
        run: dotnet build ReportPortal.csproj --configuration Release

      # 7. Create appsettings.json dynamically
      - name: Create appsettings.json
        working-directory: ./ReportPortal
        run: |
          echo "{
            \"LOGIN\": \"${{ secrets.TEST_LOGIN }}\",
            \"PASSWORD\": \"${{ secrets.TEST_PASSWORD }}\"
          }" > appsettings.json

      # 8. Run tests
      - name: Run tests
        working-directory: ./ReportPortal
        run: dotnet test ReportPortal.csproj --configuration Release --logger "trx;LogFileName=test_results.trx"

      # 9. Upload test results as artifact
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test_results.trx'
