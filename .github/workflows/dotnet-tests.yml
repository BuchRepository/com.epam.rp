name: CI - .NET Tests with Chrome

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: selenium/standalone-chrome:latest
      options: --user root --shm-size=2g

    env:
      DOTNET_ROOT: /usr/share/dotnet

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        working-directory: ./ReportPortal
        run: dotnet restore

      - name: Build solution
        working-directory: ./ReportPortal
        run: dotnet build --configuration Release --no-restore

      - name: Create appsettings.json from secrets
        working-directory: ./ReportPortal
        run: |
          echo "{
            \"LOGIN\": \"${{ secrets.TEST_LOGIN }}\",
            \"PASSWORD\": \"${{ secrets.TEST_PASSWORD }}\",
            \"Serilog\": {
              \"Using\": [\"Serilog.Sinks.Console\", \"Serilog.Sinks.File\"],
              \"MinimumLevel\": {
                \"Default\": \"Information\",
                \"Override\": {
                  \"Microsoft\": \"Warning\",
                  \"System\": \"Warning\"
                }
              },
              \"WriteTo\": [
                {
                  \"Name\": \"Console\"
                },
                {
                  \"Name\": \"File\",
                  \"Args\": {
                    \"path\": \"logs/logfile.log\",
                    \"rollingInterval\": \"Day\",
                    \"restrictedToMinimumLevel\": \"Information\"
                  }
                }
              ]
            }
          }" > appsettings.json

      - name: Print working directory
        run: pwd

      - name: Create logs folder
        working-directory: ./ReportPortal
        run: mkdir -p logs

      - name: Move logfile.log to ReportPortal/logs
        working-directory: ./ReportPortal
        run: |
        mkdir -p logs
        if [ -f ./bin/Release/net8.0/logs/logfile.log ]; then
        mv ./bin/Release/net8.0/logs/logfile.log ./logs/logfile.log;
        echo "Log file moved to ReportPortal/logs";
        else
        echo "LOG FILE NOT FOUND in bin/Release/net8.0/logs";
        fi

      - name: Check logs folder
        working-directory: ./ReportPortal
        run: |
          echo "Checking contents of ./logs:" &&
          ls -l logs &&
          if [ -f ./logs/logfile.log ]; then
          echo "Log file exists:" &&
          cat ./logs/logfile.log;
          else
          echo "LOG FILE DOES NOT EXIST!";
          fi

      - name: Upload Logs
        uses: actions/upload-artifact@v4
        with:
          name: Test Logs
          path: ./ReportPortal/logs/logfile.log

      - name: Run tests
        working-directory: ./ReportPortal
        run: dotnet test --configuration Release --logger "trx;LogFileName=test_results.trx"
