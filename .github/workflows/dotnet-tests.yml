name: CI - .NET Tests with Chrome

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: selenium/standalone-chrome:latest  # контейнер з Chrome + ChromeDriver
      options: --shm-size=2g  # рекомендовано для стабільної роботи Chrome

    env:
      DOTNET_ROOT: /usr/share/dotnet

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        working-directory: ./ReportPortal
        run: dotnet restore

      - name: Build solution
        working-directory: ./ReportPortal
        run: dotnet build --configuration Release --no-restore

      - name: Create appsettings.json from secrets
        working-directory: ./ReportPortal
        run: |
          echo "{
            \"LOGIN\": \"${{ secrets.TEST_LOGIN }}\",
            \"PASSWORD\": \"${{ secrets.TEST_PASSWORD }}\"
          }" > appsettings.json

      - name: Run tests
        working-directory: ./ReportPortal
        run: dotnet test --configuration Release --logger "trx;LogFileName=test_results.trx"
