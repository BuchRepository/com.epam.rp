name: Run Selenium Tests

on:
  push:
    branches:
      - main       # Trigger workflow on push to the main branch
  pull_request:   # Trigger workflow on any pull request

jobs:
  build-and-test:
    runs-on: ubuntu-latest   # Use the latest Ubuntu runner

    steps:
      # 1. Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Setup .NET SDK
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x   # Use .NET 8 SDK

      # 3. Install Google Chrome
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: 114
          install-chromedriver: true
          install-dependencies: true

      # 4. Show Chrome and ChromeDriver versions
      - name: Show Chrome and ChromeDriver versions
        run: |
          echo "Chrome path: ${{ steps.setup-chrome.outputs.chrome-path }}"
          echo "Chrome version: ${{ steps.setup-chrome.outputs.chrome-version }}"
          echo "ChromeDriver path: ${{ steps.setup-chrome.outputs.chromedriver-path }}"
          echo "ChromeDriver version: ${{ steps.setup-chrome.outputs.chromedriver-version }}"

      # 5. Restore NuGet packages
      - name: Restore NuGet packages
        run: dotnet restore ./ReportPortal/ReportPortal.csproj

      # 6. Build the solution
      - name: Build solution
        working-directory: ./ReportPortal
        run: dotnet build ReportPortal.csproj --configuration Release

      # 7. Create appsettings.json dynamically
      - name: Create appsettings.json
        working-directory: ./ReportPortal
        run: |
          echo "{
            \"LOGIN\": \"${{ secrets.TEST_LOGIN }}\",
            \"PASSWORD\": \"${{ secrets.TEST_PASSWORD }}\"
          }" > appsettings.json

      # 8. Run tests
      - name: Run tests
        working-directory: ./ReportPortal
        run: dotnet test ReportPortal.csproj --configuration Release --logger "trx;LogFileName=test_results.trx"

      # 9. Upload test results as artifact
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test_results.trx'
